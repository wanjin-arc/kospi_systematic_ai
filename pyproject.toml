[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kospi-systematic-research"
version = "0.4.0"
description = "Legacy KOSPI 100 research and point-in-time KOSPI 200 fundamental-technical research"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0,<3", "scikit-learn==1.9.0", "torch==2.13.0", "xgboost==3.4.1"]

[project.scripts]
kospi100-phase2-demo = "kospi100_backtest.demo:main"
kospi100-phase3 = "kospi100_baseline.cli:main"
kospi100-phase5 = "kospi100_ranking.cli:main"
kospi100-multifactor = "kospi100_multifactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
