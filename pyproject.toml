[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kospi100-systematic-trading"
version = "0.3.0"
description = "Point-in-time KOSPI 100 data, deterministic backtest engine, and daily rule baseline"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0,<3"]

[project.scripts]
kospi100-phase2-demo = "kospi100_backtest.demo:main"
kospi100-phase3 = "kospi100_baseline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
